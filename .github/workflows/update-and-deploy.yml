name: FiveStat Auto-Update

on:
  schedule:
    # Runs at 02:15 UTC every day:
    # 02:15 UK during GMT, 03:15 UK during BST
    - cron: '15 2 * * *'

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Which run to execute'
        required: true
        default: 'football'
        type: choice
        options:
          - full
          - football
          - f1
          - f1_historical
          - backtest
          - backtest_sweep
          - backtest_sweep_dispersion
          - backtest_sweep_dispersion_rho
          - backtest_sweep_comprehensive

concurrency:
  group: fivestat-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Scheduled runs update the complete website.
      # Manual runs use the option selected in GitHub Actions.
      - name: Detect run type
        id: run_type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "type=full" >> "$GITHUB_OUTPUT"
          else
            echo "type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
          fi

      # Football and FPL
      - name: Football and FPL pipeline
        if: steps.run_type.outputs.type == 'football' || steps.run_type.outputs.type == 'full'
        run: |
          python data_scraper_script.py
          python data_loader.py
          python generate_shotmaps.py
          python shotmap_script.py

      # Remove empty retry-blocking files before the F1 scraper runs
      - name: Clear stale F1 sentinels
        if: steps.run_type.outputs.type == 'f1' || steps.run_type.outputs.type == 'full'
        shell: bash
        run: |
          find data/f1/races \
            \( -name "*_laps.json" -o -name "*_stints.json" \) \
            -type f |
          while IFS= read -r file; do
            if [ "$(tr -d '[:space:]' < "$file")" = "[]" ]; then
              echo "Removing stale sentinel: $file"
              rm "$file"
            fi
          done

      # Current F1 season
      - name: F1 pipeline
        if: steps.run_type.outputs.type == 'f1' || steps.run_type.outputs.type == 'full'
        run: python f1_scraper.py

      # Confirm the essential F1 outputs are usable
      - name: Validate F1 outputs
        if: steps.run_type.outputs.type == 'f1' || steps.run_type.outputs.type == 'full'
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          base = "data/f1"
          races_dir = os.path.join(base, "races")

          def load_json(path):
              try:
                  with open(path, encoding="utf-8") as file:
                      return json.load(file)
              except Exception as exc:
                  print(f"F1 validation failed for {path}: {exc}")
                  sys.exit(1)

          schedule = load_json(os.path.join(base, "schedule.json"))
          drivers = load_json(os.path.join(base, "driver_standings.json"))
          constructors = load_json(os.path.join(base, "constructor_standings.json"))

          if not schedule:
              sys.exit("F1 validation failed: schedule is empty")

          if len(drivers) < 15:
              sys.exit(
                  f"F1 validation failed: only {len(drivers)} drivers "
                  "were found in the standings"
              )

          if len(constructors) < 8:
              sys.exit(
                  f"F1 validation failed: only {len(constructors)} constructors "
                  "were found in the standings"
              )

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Only require races dated before today. This avoids failing at
          # 02:15 UTC before a race taking place later that same day.
          expected_completed = [
              race for race in schedule
              if race.get("date", "") < today
          ]

          if expected_completed:
              latest = max(
                  expected_completed,
                  key=lambda race: int(race["round"])
              )

              year = int(latest["season"])
              round_number = int(latest["round"])

              results_path = os.path.join(
                  races_dir,
                  f"{year}_{round_number:02d}_results.json"
              )

              results = load_json(results_path)

              if len(results) < 15:
                  sys.exit(
                      "F1 validation failed: "
                      f"{latest.get('name', 'latest race')} should be complete, "
                      f"but {results_path} contains only {len(results)} results"
                  )

              print(
                  "F1 validation passed: "
                  f"{latest.get('name')} is the latest completed race "
                  f"({len(results)} results)"
              )
          else:
              print("F1 validation passed: no completed races yet")
          PY

      # Historical F1 backfill — manual only
      - name: F1 historical pipeline
        if: steps.run_type.outputs.type == 'f1_historical'
        run: python f1_scraper.py --historical

      # Model backtest
      - name: Backtest pipeline
        if: steps.run_type.outputs.type == 'backtest'
        run: python backtest.py

      - name: Backtest sweep pipeline
        if: steps.run_type.outputs.type == 'backtest_sweep'
        run: |
          mkdir -p data/tables
          {
            python backtest.py --sweep-alpha
            python backtest.py --sweep-rho
            python backtest.py --sweep
          } > data/tables/sweep_report.txt

      - name: Backtest dispersion sweep pipeline
        if: steps.run_type.outputs.type == 'backtest_sweep_dispersion'
        run: |
          mkdir -p data/tables
          python backtest.py --sweep-dispersion \
            > data/tables/dispersion_sweep_report.txt

      - name: Backtest dispersion-rho sweep pipeline
        if: steps.run_type.outputs.type == 'backtest_sweep_dispersion_rho'
        run: |
          mkdir -p data/tables
          python backtest.py --sweep-dispersion-rho \
            > data/tables/dispersion_rho_sweep_report.txt

      - name: Backtest comprehensive sweep pipeline
        if: steps.run_type.outputs.type == 'backtest_sweep_comprehensive'
        run: |
          mkdir -p data/tables
          python backtest.py --sweep-comprehensive \
            > data/tables/comprehensive_sweep_report.txt

      # Commit updated data and trigger Railway
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m \
              "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC') [${{ steps.run_type.outputs.type }}]"
            git push
          fi
